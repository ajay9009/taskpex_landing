<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found – TaskPex</title>
  <style>
    body { background: #0d0f1a; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
    #message {
      background: #1a1e35;
      max-width: 380px;
      margin: 100px auto 16px;
      padding: 40px 28px 28px;
      border-radius: 16px;
      border: 1px solid #2a2f4a;
      text-align: center;
    }
    #message h2 { color: #f5c518; font-size: 48px; font-weight: 900; margin: 0 0 8px; }
    #message h1 { font-size: 22px; font-weight: 700; color: #fff; margin: 0 0 12px; }
    #message p { color: #a0aec0; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    #message a {
      display: block;
      text-align: center;
      background: linear-gradient(135deg, #f5c518, #ff8c00);
      text-decoration: none;
      color: #000;
      font-weight: 800;
      padding: 14px;
      border-radius: 50px;
    }
    @media (max-width: 480px) {
      body { border-top: 8px solid #f5c518; }
      #message { margin-top: 40px; }
    }
  </style>
</head>
<body>
  <div id="message">
    <h2>404</h2>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist. Head back home and keep earning!</p>
    <a href="/">← Go to TaskPex Home</a>
  </div>
</body>
</html>
